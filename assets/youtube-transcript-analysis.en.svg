<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5b57"/><stop offset="1" stop-color="#ff766f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28a9ef"/><stop offset="1" stop-color="#57c8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17324d" flood-opacity=".10"/>
    </filter>
    <style>
      .title{font:800 66px Arial,Helvetica,sans-serif;fill:#0d2f55}
      .subtitle{font:700 38px Arial,Helvetica,sans-serif;fill:#0d2f55}
      .lead{font:600 25px Arial,Helvetica,sans-serif;fill:#4c3850}
      .section{font:800 39px Arial,Helvetica,sans-serif;fill:#fff}
      .step{font:800 25px Arial,Helvetica,sans-serif;fill:#14345c}
      .body{font:500 21px Arial,Helvetica,sans-serif;fill:#294463}
      .small{font:600 18px Arial,Helvetica,sans-serif;fill:#34506f}
      .mini{font:700 20px Arial,Helvetica,sans-serif;fill:#17365e}
      .num{font:800 34px Arial,Helvetica,sans-serif;fill:#fff}
      .repo{font:700 23px Arial,Helvetica,sans-serif;fill:#153457}
    </style>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <circle cx="1070" cy="90" r="80" fill="#ffe7d9"/><circle cx="1095" cy="130" r="52" fill="#fff3df"/>
  <text x="54" y="95" class="title">Help Codex Understand <tspan fill="#ef3f43">YouTube</tspan></text>
  <text x="58" y="148" class="subtitle">A caption-first video analysis skill</text>
  <rect x="54" y="183" width="660" height="58" rx="29" fill="#ffe4e8"/>
  <text x="80" y="221" class="lead">Traceable analysis without processing the full video first.</text>

  <rect x="54" y="270" width="1092" height="70" rx="35" fill="#dff1ff"/>
  <circle cx="92" cy="305" r="21" fill="#163a61"/>
  <text x="126" y="314" class="repo">tsetsugekka/codex-youtube-transcript-analysis-skill</text>

  <rect x="42" y="380" width="1116" height="500" rx="34" fill="#fff" stroke="#e8edf3" stroke-width="2" filter="url(#shadow)"/>
  <rect x="42" y="380" width="360" height="70" rx="34" fill="url(#red)"/>
  <text x="72" y="427" class="section">Analyze videos in 4 steps</text>
  <text x="520" y="428" class="lead">Turn YouTube into analyzable, citable knowledge</text>

  <g transform="translate(68 478)">
    <rect width="246" height="350" rx="28" fill="#fff0f4"/>
    <circle cx="38" cy="42" r="29" fill="#ef4f8e"/><text x="28" y="54" class="num">1</text>
    <text x="78" y="37" class="step"><tspan x="78" dy="0">Input a video</tspan><tspan x="78" dy="30">or channel</tspan></text>
    <rect x="34" y="122" width="178" height="112" rx="18" fill="#fff" stroke="#8fb6db" stroke-width="4"/>
    <rect x="49" y="143" width="148" height="72" rx="10" fill="#f8fbff"/>
    <rect x="66" y="162" width="65" height="41" rx="11" fill="#f22d35"/><polygon points="92,170 92,195 113,182" fill="#fff"/>
    <text x="32" y="282" class="body"><tspan x="32">Paste a YouTube URL</tspan><tspan x="32" dy="29">or give a channel link.</tspan></text>
  </g>

  <g transform="translate(338 478)">
    <rect width="246" height="350" rx="28" fill="#eef9ff"/>
    <circle cx="38" cy="42" r="29" fill="#ff9a36"/><text x="28" y="54" class="num">2</text>
    <text x="78" y="37" class="step"><tspan x="78">Extract accessible</tspan><tspan x="78" dy="30">captions</tspan></text>
    <rect x="40" y="125" width="168" height="118" rx="16" fill="#fff" stroke="#79add9" stroke-width="4"/>
    <rect x="58" y="143" width="58" height="35" rx="6" fill="#173d69"/><text x="68" y="169" font-family="Arial" font-size="23" font-weight="800" fill="#fff">CC</text>
    <line x1="59" y1="194" x2="187" y2="194" stroke="#9db5ca" stroke-width="5"/><line x1="59" y1="214" x2="172" y2="214" stroke="#c1d2df" stroke-width="5"/>
    <text x="32" y="282" class="body"><tspan x="32">Fetch available captions</tspan><tspan x="32" dy="29">plus basic metadata.</tspan></text>
  </g>

  <g transform="translate(608 478)">
    <rect width="246" height="350" rx="28" fill="#eefcf8"/>
    <circle cx="38" cy="42" r="29" fill="#42ba92"/><text x="28" y="54" class="num">3</text>
    <text x="78" y="37" class="step"><tspan x="78">Build a Markdown</tspan><tspan x="78" dy="30">corpus</tspan></text>
    <path d="M52 124h115l27 28v105H52z" fill="#fff" stroke="#75aee1" stroke-width="4"/>
    <path d="M167 124v29h28" fill="none" stroke="#75aee1" stroke-width="4"/>
    <text x="72" y="173" font-family="monospace" font-size="25" font-weight="800" fill="#183c68">M↓</text>
    <line x1="72" y1="196" x2="169" y2="196" stroke="#8dafcb" stroke-width="5"/><line x1="72" y1="218" x2="158" y2="218" stroke="#b3c9da" stroke-width="5"/>
    <text x="32" y="282" class="body"><tspan x="32">Keep timestamps, language</tspan><tspan x="32" dy="29">and source provenance.</tspan></text>
  </g>

  <g transform="translate(878 478)">
    <rect width="246" height="350" rx="28" fill="#f1f5ff"/>
    <circle cx="38" cy="42" r="29" fill="#4d82ed"/><text x="28" y="54" class="num">4</text>
    <text x="78" y="37" class="step"><tspan x="78">Analyze for your</tspan><tspan x="78" dy="30">question</tspan></text>
    <circle cx="93" cy="178" r="47" fill="#ddebff" stroke="#2e6096" stroke-width="5"/>
    <rect x="65" y="166" width="56" height="37" rx="15" fill="#fff"/><circle cx="81" cy="184" r="5" fill="#2e6096"/><circle cx="104" cy="184" r="5" fill="#2e6096"/>
    <path d="M141 143h68a16 16 0 0 1 16 16v44a16 16 0 0 1-16 16h-43l-20 18 4-18h-9a16 16 0 0 1-16-16v-44a16 16 0 0 1 16-16z" fill="#fff" stroke="#7aa9e3" stroke-width="4"/>
    <text x="148" y="170" class="small"><tspan x="148">What does</tspan><tspan x="148" dy="23">it say?</tspan></text>
    <text x="32" y="282" class="body"><tspan x="32">Summarize, compare, or</tspan><tspan x="32" dy="29">answer with timestamp links.</tspan></text>
  </g>

  <rect x="42" y="914" width="1116" height="360" rx="34" fill="#fff" stroke="#d9eef8" stroke-width="3"/>
  <rect x="42" y="914" width="450" height="70" rx="34" fill="url(#blue)"/>
  <text x="72" y="961" class="section">What problems does it solve?</text>

  <g transform="translate(70 1010)">
    <rect width="250" height="218" rx="25" fill="#fff1f4"/>
    <rect x="86" y="28" width="78" height="58" rx="10" fill="#fff" stroke="#6e7fa1" stroke-width="5"/><circle cx="155" cy="38" r="16" fill="#ef576d"/><text x="150" y="45" font-family="Arial" font-size="18" font-weight="800" fill="#fff">!</text>
    <text x="26" y="122" class="mini">Pages are hard to parse</text>
    <text x="26" y="154" class="small"><tspan x="26">Dynamic watch pages</tspan><tspan x="26" dy="24">can be unreliable.</tspan></text>
  </g>
  <g transform="translate(338 1010)">
    <rect width="250" height="218" rx="25" fill="#fff8e9"/>
    <rect x="70" y="31" width="110" height="65" rx="12" fill="#fff" stroke="#5d7195" stroke-width="5"/><polygon points="111,48 111,79 137,63" fill="#657da1"/>
    <text x="34" y="122" class="mini">Full video is too heavy</text>
    <text x="32" y="154" class="small"><tspan x="32">Video and audio consume</tspan><tspan x="32" dy="24">far more context.</tspan></text>
  </g>
  <g transform="translate(606 1010)">
    <rect width="250" height="218" rx="25" fill="#f4f0ff"/>
    <rect x="75" y="31" width="95" height="65" rx="9" fill="#fff" stroke="#775dc0" stroke-width="5"/><text x="91" y="72" font-family="Arial" font-size="25" font-weight="800" fill="#7358c0">CC</text><circle cx="173" cy="82" r="18" fill="#ef586b"/><text x="166" y="90" font-family="Arial" font-size="24" font-weight="800" fill="#fff">×</text>
    <text x="23" y="122" class="mini">Copied captions lose context</text>
    <text x="32" y="154" class="small"><tspan x="32">Plain text loses timing</tspan><tspan x="32" dy="24">and provenance.</tspan></text>
  </g>
  <g transform="translate(874 1010)">
    <rect width="250" height="218" rx="25" fill="#effcf8"/>
    <circle cx="116" cy="61" r="35" fill="none" stroke="#32577a" stroke-width="7"/><line x1="142" y1="87" x2="174" y2="119" stroke="#32577a" stroke-width="9" stroke-linecap="round"/>
    <text x="27" y="122" class="mini">Results are hard to verify</text>
    <text x="32" y="154" class="small"><tspan x="32">Conclusions need clickable</tspan><tspan x="32" dy="24">timestamp evidence.</tspan></text>
  </g>

  <rect x="42" y="1308" width="1116" height="310" rx="34" fill="#fff" stroke="#fde8d7" stroke-width="3"/>
  <rect x="42" y="1308" width="425" height="70" rx="34" fill="url(#red)"/>
  <text x="72" y="1355" class="section">What can you use it for?</text>

  <g transform="translate(70 1409)">
    <rect width="158" height="150" rx="22" fill="#fff3f6"/><text x="79" y="50" font-size="39" text-anchor="middle">▤</text><text x="79" y="86" class="mini" text-anchor="middle">Summaries</text><text x="79" y="116" class="small" text-anchor="middle">main points</text>
  </g>
  <g transform="translate(246 1409)">
    <rect width="158" height="150" rx="22" fill="#effcf8"/><text x="79" y="50" font-size="39" text-anchor="middle">◷</text><text x="79" y="86" class="mini" text-anchor="middle">Timelines</text><text x="79" y="116" class="small" text-anchor="middle">key moments</text>
  </g>
  <g transform="translate(422 1409)">
    <rect width="158" height="150" rx="22" fill="#fff8e8"/><text x="79" y="50" font-size="39" text-anchor="middle">✦</text><text x="79" y="86" class="mini" text-anchor="middle">Viewpoints</text><text x="79" y="116" class="small" text-anchor="middle">claims + evidence</text>
  </g>
  <g transform="translate(598 1409)">
    <rect width="158" height="150" rx="22" fill="#ecfaff"/><text x="79" y="50" font-size="39" text-anchor="middle">☷</text><text x="79" y="86" class="mini" text-anchor="middle">Extraction</text><text x="79" y="116" class="small" text-anchor="middle">people + events</text>
  </g>
  <g transform="translate(774 1409)">
    <rect width="158" height="150" rx="22" fill="#f8f0ff"/><text x="79" y="50" font-size="39" text-anchor="middle">⚖</text><text x="79" y="86" class="mini" text-anchor="middle">Comparison</text><text x="79" y="116" class="small" text-anchor="middle">videos + views</text>
  </g>
  <g transform="translate(950 1409)">
    <rect width="158" height="150" rx="22" fill="#eef6ff"/><text x="79" y="50" font-size="39" text-anchor="middle">?</text><text x="79" y="86" class="mini" text-anchor="middle">Q&amp;A</text><text x="79" y="116" class="small" text-anchor="middle">from captions</text>
  </g>

  <rect x="42" y="1652" width="1116" height="102" rx="30" fill="#fffdf4" stroke="#f4ead0" stroke-width="3"/>
  <circle cx="83" cy="1703" r="25" fill="#ff5b5f"/><text x="77" y="1712" font-family="Arial" font-size="27" font-weight="800" fill="#fff">!</text>
  <text x="124" y="1695" class="step">Scope</text>
  <text x="227" y="1687" class="small"><tspan x="227">Best for public videos with accessible captions.</tspan><tspan x="227" dy="27">Not for no-caption, restricted, or strongly visual-only content.</tspan></text>
</svg>